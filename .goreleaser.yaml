# goreleaser config for rui.
#
# Triggered by `.github/workflows/release.yml` on `git push origin vX.Y.Z`:
#   1. Cross-compiles `cmd/rui` for darwin/linux × amd64/arm64.
#   2. Tarballs each binary with LICENSE + README.md alongside.
#   3. Computes checksums.txt over all archives.
#   4. Creates the GitHub release with all artifacts attached.
#   5. Renders Formula/rui.rb pointing at the per-platform tarballs and
#      pushes it to j4y-w4lk3r/homebrew-rui (auth via HOMEBREW_TAP_GITHUB_TOKEN).
#
# Local dry-run (no publish, builds in dist/):
#   goreleaser release --snapshot --clean
# Local single-arch build (fastest sanity check):
#   goreleaser build --snapshot --clean --single-target

version: 2

project_name: rui

before:
  hooks:
    - go mod tidy

builds:
  - id: rui
    main: ./cmd/rui
    binary: rui
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      # 32-bit ARM has multiple sub-architectures. v7 covers Pi 2/3,
      # most Cortex-A7/A9 SBCs, and the routers people actually run
      # this thing on. v6 (Pi 1, Pi Zero) is too rare to bother.
      - "7"
    ignore:
      # darwin/arm doesn't exist as a real platform (Apple is arm64-only)
      - goos: darwin
        goarch: arm
      # We don't ship 32-bit Windows ARM (audience is essentially zero)
      # nor 64-bit Windows ARM yet (Surface Pro X / Apple-Silicon-VM
      # users are a tiny niche; can add later if asked).
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: rui
    formats: [tar.gz]
    # Windows users overwhelmingly expect .zip; let them have it.
    format_overrides:
      - goos: windows
        formats: [zip]
    # Format examples:
    #   rui_0.1.1_Darwin_arm64.tar.gz
    #   rui_0.1.1_Linux_armv7.tar.gz
    #   rui_0.1.1_Windows_x86_64.zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if and (eq .Arch "arm") (eq .Arm "7") }}armv7
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'merge conflict'
      - '(?i)^typo'

# Auto-publishes the formula to j4y-w4lk3r/homebrew-rui.
# Requires repo secret HOMEBREW_TAP_GITHUB_TOKEN (fine-grained PAT with
# Contents: read+write on j4y-w4lk3r/homebrew-rui).
#
# Note on the deprecation warning: in goreleaser v2.16 `brews:` is
# soft-deprecated in favor of `homebrew_casks:`. We deliberately stay
# on `brews:` for now because casks invoke macOS Gatekeeper, and our
# binaries are unsigned — first-run on a Mac would show "rui can't be
# opened" until the user manually clears the quarantine xattr. Until
# we set up Apple Developer notarization (or migrate to a hand-rolled
# formula-bump script), formulas give a strictly better UX for our
# audience. The deprecation will keep working until at least the next
# major goreleaser release.
brews:
  - name: rui
    # Push to Formula/rui.rb (the convention) rather than rui.rb at the
    # tap root. Brew resolves both, but Formula/ wins when it's present;
    # if we let goreleaser drop a sibling at root we end up with two
    # files diverging on each release.
    directory: Formula
    repository:
      owner: j4y-w4lk3r
      name: homebrew-rui
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/j4y-w4lk3r/rui"
    description: "Terminal UI for managing home routers (Orange Livebox/Funbox today; Play/Fritz on the roadmap)"
    license: "MIT"
    commit_author:
      name: rui-release-bot
      email: rui-release-bot@users.noreply.github.com
    commit_msg_template: "rui: bump to {{ .Tag }}"
    test: |
      system "#{bin}/rui", "-h"
    install: |
      bin.install "rui"
